<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Agentics</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #0b1020; color: #eef2ff; }
    .card { max-width: 720px; margin: 0 auto; overflow: hidden; border: 1px solid #2c3655; border-radius: 22px; background: linear-gradient(145deg, #151d34, #0f1629); box-shadow: 0 22px 70px rgba(0, 0, 0, .32); }
    .accent { height: 4px; background: linear-gradient(90deg, #7c5cff, #36d5c2); }
    .content { padding: 30px; }
    .brand { margin: 0 0 24px; font-size: 15px; font-weight: 760; letter-spacing: .12em; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px; color: #cad3ef; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #36d5c2; box-shadow: 0 0 0 5px rgba(54, 213, 194, .12); animation: pulse 2.4s ease-in-out infinite; }
    .dot.empty { background: #e4b95d; box-shadow: 0 0 0 5px rgba(228, 185, 93, .12); }
    .dot.unavailable { background: #8791aa; box-shadow: 0 0 0 5px rgba(135, 145, 170, .12); }
    h1 { margin: 0; max-width: 560px; font-size: clamp(28px, 5vw, 42px); line-height: 1.08; letter-spacing: -.035em; }
    .summary { margin: 15px 0 0; max-width: 590px; color: #b8c1dc; font-size: 16px; line-height: 1.6; }
    .collections { margin: 23px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
    .collection { display: flex; justify-content: space-between; gap: 18px; padding: 12px 14px; border: 1px solid #2c3655; border-radius: 12px; background: rgba(255, 255, 255, .035); }
    .count { color: #9ea8c5; white-space: nowrap; }
    .continuing { margin: 25px 0 0; padding-top: 18px; border-top: 1px solid #2c3655; color: #d6dcf1; font-size: 14px; }
    @keyframes pulse { 50% { opacity: .58; transform: scale(.9); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="accent"></div>
    <section class="content">
      <p class="brand">Aegis Agentics</p>
      <div class="status"><span class="dot {{STATUS_CLASS}}" aria-hidden="true"></span><span>{{STATUS_LABEL}}</span></div>
      <h1>{{HEADLINE}}</h1>
      <p class="summary">{{SUMMARY}}</p>
      {{COLLECTIONS}}
      <p class="continuing">Continuing with your request</p>
    </section>
  </main>
</body>
</html>
